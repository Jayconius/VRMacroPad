<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">The life of a login plugin</title>
  <desc id="d">States: not connected, waiting for approval, connected. Pressing Connect moves to waiting; approving moves to connected; Disconnect or an expired token returns to not connected; a saved login reconnects at startup.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .h { font-size: 22px; font-weight: 700; fill: #f2f5fa; }
    .sub { font-size: 14px; fill: #9fb0c8; }
    .t { font-size: 14.5px; fill: #c9d4e5; }
    .st { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13.5px; fill: #f2f5fa; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#9fb0c8"/></marker>
  </defs>
  <rect width="900" height="470" rx="18" fill="#101826"/>
  <text x="36" y="52" class="h">The life of a login plugin</text>
  <text x="36" y="76" class="sub">What status() reports, and what moves it. A person is always the one who approves.</text>

  <!-- states -->
  <rect x="40" y="170" width="200" height="86" rx="16" fill="#2a3040" stroke="#8a97ad" stroke-width="2"/>
  <text x="140" y="205" text-anchor="middle" class="st" style="fill:#c9d4e5">Not connected</text>
  <text x="140" y="228" text-anchor="middle" class="mono t" style="font-size:13px">status: 'needs-auth'</text>

  <rect x="350" y="170" width="200" height="86" rx="16" fill="#45301f" stroke="#e8a45c" stroke-width="2"/>
  <text x="450" y="205" text-anchor="middle" class="st" style="fill:#f2c48a">Waiting for you</text>
  <text x="450" y="228" text-anchor="middle" class="mono t" style="font-size:13px">status: 'authorizing'</text>

  <rect x="660" y="170" width="200" height="86" rx="16" fill="#1f3d34" stroke="#3fb88a" stroke-width="2"/>
  <text x="760" y="205" text-anchor="middle" class="st" style="fill:#7fe0b8">Connected</text>
  <text x="760" y="228" text-anchor="middle" class="mono t" style="font-size:13px">status: 'connected'</text>

  <!-- forward transitions -->
  <path d="M240 200 H346" stroke="#9fb0c8" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="293" y="188" text-anchor="middle" class="lab">press Connect</text>
  <text x="293" y="222" text-anchor="middle" class="mono t" style="font-size:12.5px">connect()</text>

  <path d="M550 200 H656" stroke="#9fb0c8" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="603" y="188" text-anchor="middle" class="lab">you approve</text>
  <text x="603" y="222" text-anchor="middle" class="t" style="font-size:12.5px">code, browser</text>
  <text x="603" y="238" text-anchor="middle" class="t" style="font-size:12.5px">or Allow</text>

  <!-- back: disconnect / expired (lower loop) -->
  <path d="M760 256 V330 H140 V260" stroke="#9fb0c8" stroke-width="2.5" fill="none" marker-end="url(#a)" stroke-dasharray="7 6"/>
  <text x="450" y="322" text-anchor="middle" class="lab">press Disconnect, or the login stops working (revoked / expired)</text>
  <text x="450" y="352" text-anchor="middle" class="mono t" style="font-size:12.5px">disconnect()  →  token deleted from ctx.secrets</text>

  <!-- cancel loop (upper) -->
  <path d="M450 170 V128 H140 V166" stroke="#9fb0c8" stroke-width="2.5" fill="none" marker-end="url(#a)" stroke-dasharray="7 6"/>
  <text x="295" y="120" text-anchor="middle" class="lab">cancel, denied, or the code expires</text>

  <!-- startup -->
  <rect x="36" y="384" width="828" height="64" rx="12" fill="#182236"/>
  <text x="56" y="410" class="lab" style="font-weight:700">At startup</text>
  <text x="56" y="432" class="t">A login saved in <tspan class="mono" style="font-size:13px">ctx.secrets</tspan> comes back as <tspan class="mono" style="font-size:13px">'connected'</tspan>. <tspan style="font-weight:700;fill:#f2f5fa">Auto-connect on startup</tspan> does it even if no button needs it.</text>
</svg>
