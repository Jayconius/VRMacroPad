<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a plugin</title>
  <desc id="d">A plugins/mydiscord folder containing plugin.js, runtime.js and actions.js, and what each file is responsible for.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .h { font-size: 22px; font-weight: 700; fill: #f2f5fa; }
    .sub { font-size: 14px; fill: #9fb0c8; }
    .fname { font-size: 18px; font-weight: 700; fill: #f2f5fa; }
    .body { font-size: 15px; fill: #c9d4e5; }
    .tag { font-size: 13px; font-weight: 700; }
  </style>
  <rect width="900" height="460" rx="18" fill="#101826"/>
  <text x="36" y="52" class="h">Anatomy of a plugin</text>
  <text x="36" y="76" class="sub">A plugin is just a folder. The app finds it, reads plugin.js, and does the rest.</text>

  <!-- folder tree -->
  <rect x="36" y="100" width="270" height="322" rx="14" fill="#182236" stroke="#2b3b58"/>
  <text x="58" y="136" class="mono" style="font-size:16px;fill:#9fb0c8">plugins/</text>
  <path d="M76 148 h14 l5 6 h20 a3 3 0 0 1 3 3 v18 a3 3 0 0 1 -3 3 h-39 a3 3 0 0 1 -3 -3 v-24 a3 3 0 0 1 3 -3z" fill="#e8c46a"/>
  <text x="122" y="168" class="mono" style="font-size:18px;font-weight:700;fill:#f2f5fa">mydiscord/</text>
  <rect x="96" y="190" width="190" height="44" rx="10" fill="#22335a" stroke="#4c8dff" stroke-width="2"/>
  <text x="114" y="219" class="mono" style="font-size:17px;font-weight:700;fill:#8fbcff">plugin.js</text>
  <rect x="96" y="250" width="190" height="44" rx="10" fill="#1f3d34" stroke="#3fb88a" stroke-width="2"/>
  <text x="114" y="279" class="mono" style="font-size:17px;font-weight:700;fill:#7fe0b8">runtime.js</text>
  <rect x="96" y="310" width="190" height="44" rx="10" fill="#45301f" stroke="#e8a45c" stroke-width="2"/>
  <text x="114" y="339" class="mono" style="font-size:17px;font-weight:700;fill:#f2c48a">actions.js</text>
  <text x="76" y="392" class="sub">…drop the folder in, restart.</text>

  <!-- connectors -->
  <path d="M286 212 H340" stroke="#4c8dff" stroke-width="2.5" fill="none"/>
  <path d="M286 272 H340" stroke="#3fb88a" stroke-width="2.5" fill="none"/>
  <path d="M286 332 H340" stroke="#e8a45c" stroke-width="2.5" fill="none"/>

  <!-- descriptions -->
  <rect x="340" y="188" width="524" height="48" rx="10" fill="#182236"/>
  <text x="358" y="210" class="fname" style="fill:#8fbcff">The manifest <tspan class="mono" style="font-size:14px;fill:#9fb0c8">(what it is)</tspan></text>
  <text x="358" y="230" class="body">Name, icon, settings fields, and which actions it offers.</text>

  <rect x="340" y="248" width="524" height="48" rx="10" fill="#182236"/>
  <text x="358" y="270" class="fname" style="fill:#7fe0b8">The runtime <tspan class="mono" style="font-size:14px;fill:#9fb0c8">(what it does)</tspan></text>
  <text x="358" y="290" class="body">Talks to the service, holds the login, reports status.</text>

  <rect x="340" y="308" width="524" height="48" rx="10" fill="#182236"/>
  <text x="358" y="330" class="fname" style="fill:#f2c48a">The actions <tspan class="mono" style="font-size:14px;fill:#9fb0c8">(what buttons can press)</tspan></text>
  <text x="358" y="350" class="body">One entry per thing a button can do, e.g. "Send a message".</text>

  <text x="340" y="392" class="sub">Only plugin.js is required. Everything else is optional —</text>
  <text x="340" y="412" class="sub">a plugin with no live connection doesn't need a runtime at all.</text>
</svg>
