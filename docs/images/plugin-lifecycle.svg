<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">When your plugin's code runs</title>
  <desc id="d">Timeline: the app starts and calls createRuntime; settings changes call configure; a button that uses the plugin appearing calls sync with needs true so the plugin starts; removing it calls sync with needs false so it stops; quitting calls stop.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .h { font-size: 22px; font-weight: 700; fill: #f2f5fa; }
    .sub { font-size: 14px; fill: #9fb0c8; }
    .t { font-size: 15px; fill: #c9d4e5; }
    .b { font-size: 16px; font-weight: 700; fill: #f2f5fa; }
    .code { font-size: 14.5px; font-weight: 700; }
  </style>
  <rect width="900" height="470" rx="18" fill="#101826"/>
  <text x="36" y="52" class="h">When your plugin's code runs</text>
  <text x="36" y="76" class="sub">The app calls your runtime at these moments. You only write the ones you need.</text>

  <!-- timeline -->
  <path d="M60 210 H840" stroke="#2b3b58" stroke-width="4"/>
  <!-- idle bands -->
  <rect x="120" y="198" width="200" height="24" rx="12" fill="#2a3040"/>
  <text x="268" y="215" text-anchor="middle" class="t" style="font-size:13px">idle</text>
  <rect x="320" y="198" width="270" height="24" rx="12" fill="#1f3d34" stroke="#3fb88a"/>
  <text x="455" y="215" text-anchor="middle" class="t" style="font-size:13px;fill:#7fe0b8">running: polling / connected</text>
  <rect x="590" y="198" width="180" height="24" rx="12" fill="#2a3040"/>
  <text x="680" y="215" text-anchor="middle" class="t" style="font-size:13px">idle again</text>

  <!-- events -->
  <g>
    <circle cx="120" cy="210" r="9" fill="#4c8dff"/>
    <path d="M120 200 V150" stroke="#4c8dff" stroke-width="2"/>
    <rect x="52" y="96" width="136" height="56" rx="10" fill="#22335a" stroke="#4c8dff"/>
    <text x="120" y="120" text-anchor="middle" class="mono code" style="fill:#8fbcff">createRuntime(ctx)</text>
    <text x="120" y="141" text-anchor="middle" class="t" style="font-size:13px">app starts, once</text>
  </g>
  <g>
    <circle cx="220" cy="210" r="9" fill="#8b86ff"/>
    <path d="M220 220 V262" stroke="#8b86ff" stroke-width="2"/>
    <rect x="150" y="262" width="140" height="56" rx="10" fill="#2c2a55" stroke="#8b86ff"/>
    <text x="220" y="286" text-anchor="middle" class="mono code" style="fill:#b7b3ff">configure()</text>
    <text x="220" y="307" text-anchor="middle" class="t" style="font-size:13px">a setting changed</text>
  </g>
  <g>
    <circle cx="320" cy="210" r="9" fill="#3fb88a"/>
    <path d="M320 200 V150" stroke="#3fb88a" stroke-width="2"/>
    <rect x="228" y="96" width="184" height="56" rx="10" fill="#1f3d34" stroke="#3fb88a"/>
    <text x="320" y="120" text-anchor="middle" class="mono code" style="fill:#7fe0b8">sync({ you: true })</text>
    <text x="320" y="141" text-anchor="middle" class="t" style="font-size:13px">a button using you appears</text>
  </g>
  <g>
    <circle cx="590" cy="210" r="9" fill="#e8a45c"/>
    <path d="M590 200 V150" stroke="#e8a45c" stroke-width="2"/>
    <rect x="498" y="96" width="184" height="56" rx="10" fill="#45301f" stroke="#e8a45c"/>
    <text x="590" y="120" text-anchor="middle" class="mono code" style="fill:#f2c48a">sync({ })</text>
    <text x="590" y="141" text-anchor="middle" class="t" style="font-size:13px">the last one is removed</text>
  </g>
  <g>
    <circle cx="770" cy="210" r="9" fill="#e87c9f"/>
    <path d="M770 220 V262" stroke="#e87c9f" stroke-width="2"/>
    <rect x="690" y="262" width="160" height="56" rx="10" fill="#4d2a3a" stroke="#e87c9f"/>
    <text x="770" y="286" text-anchor="middle" class="mono code" style="fill:#f0a0bd">stop()</text>
    <text x="770" y="307" text-anchor="middle" class="t" style="font-size:13px">quit, or switched off</text>
  </g>

  <!-- takeaways -->
  <rect x="36" y="350" width="828" height="92" rx="12" fill="#182236"/>
  <text x="56" y="378" class="b">Why this matters</text>
  <text x="56" y="402" class="t">A plugin that isn't on any button costs nothing: no polling and no open connections.</text>
  <text x="56" y="426" class="t">Your <tspan class="mono" style="font-size:14px">sync(needs)</tspan> decides when to start and stop. With <tspan style="font-weight:700;fill:#f2f5fa">Auto-connect on startup</tspan> on, it is always needed.</text>
</svg>
